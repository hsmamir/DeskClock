[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    madhephaestus/ESP32Servo @ ^3.0.5
    bblanchon/ArduinoJson @ ^7.0.4

build_flags =
    -D USER_SETUP_LOADED=1
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_CS=5
    -D TFT_DC=2
    -D TFT_RST=4
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SPI_FREQUENCY=27000000

; ---- Real hardware: ST7735, 128x160 ----
[env:esp32dev]
build_flags =
    ${env.build_flags}
    -D ST7735_DRIVER=1
    -D TFT_WIDTH=128
    -D TFT_HEIGHT=160

; ---- Wokwi simulation: ST7735 isn't a simulated part, so this env swaps
; the driver/resolution to ILI9341 (wokwi-ili9341) — same CS/DC/RST/MOSI/SCLK
; pins, no code changes needed elsewhere. Switch back to esp32dev for the
; real ST7735 hardware. ----
[env:wokwi]
build_flags =
    ${env.build_flags}
    -D ILI9341_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320