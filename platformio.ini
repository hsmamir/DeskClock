[platformio]
; Only this env is built/uploaded when you press Build/Upload without picking
; one. Without this line PlatformIO runs EVERY env one after another (green,
; red, ..., wokwi), which looks like an endless upload loop. Change it to the
; ST7735 variant that looks right on your display.
default_envs = esp32dev

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    madhephaestus/ESP32Servo @ ^3.0.5
    bblanchon/ArduinoJson @ ^7.0.4
    tzapu/WiFiManager @ ^2.0.17

build_flags =
    -D USER_SETUP_LOADED=1
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_CS=5
    -D TFT_DC=2
    -D TFT_RST=4
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SPI_FREQUENCY=27000000

; ---- Real hardware: ST7735, 128x160 ----
; Cheap 1.8" ST7735 modules come in several "tab" variants (the colour of the
; protective film's tab) that differ in pixel offset and colour order. If the
; picture is shifted, has noisy lines on two edges, or the colours are wrong,
; switch to the next env below until it looks right (VS Code bottom bar -> env).
;
;   esp32dev        black tab / no offset   (this was the default before)
;   esp32dev-green  green tab               (most common 128x160 module)
;   esp32dev-green2 green tab, 2 px offset  (noise on two edges with -green)
;   esp32dev-green3 green tab, other offset
;   esp32dev-red    red tab
;
; Extra tweaks you can add to build_flags of the env that works best:
;   -D TFT_INVERSION_ON=1     colours look inverted (black <-> white)
;   -D TFT_RGB_ORDER=0        red/blue swapped (cyan looks orange); use 1 to undo
;   -D SPI_FREQUENCY=20000000 random dots/glitches -> slower, more stable SPI
[env:esp32dev]
build_flags =
    ${env.build_flags}
    -D ST7735_DRIVER=1
    -D ST7735_BLACKTAB=1
    -D TFT_WIDTH=128
    -D TFT_HEIGHT=160

[env:esp32dev-green]
build_flags =
    ${env.build_flags}
    -D ST7735_DRIVER=1
    -D ST7735_GREENTAB=1
    -D TFT_WIDTH=128
    -D TFT_HEIGHT=160

[env:esp32dev-green2]
build_flags =
    ${env.build_flags}
    -D ST7735_DRIVER=1
    -D ST7735_GREENTAB2=1
    -D TFT_WIDTH=128
    -D TFT_HEIGHT=160

[env:esp32dev-green3]
build_flags =
    ${env.build_flags}
    -D ST7735_DRIVER=1
    -D ST7735_GREENTAB3=1
    -D TFT_WIDTH=128
    -D TFT_HEIGHT=160

[env:esp32dev-red]
build_flags =
    ${env.build_flags}
    -D ST7735_DRIVER=1
    -D ST7735_REDTAB=1
    -D TFT_WIDTH=128
    -D TFT_HEIGHT=160

; ---- Wokwi simulation: ST7735 isn't a simulated part, so this env swaps
; the driver/resolution to ILI9341 (wokwi-ili9341) — same CS/DC/RST/MOSI/SCLK
; pins, no code changes needed elsewhere. Switch back to esp32dev for the
; real ST7735 hardware. ----
[env:wokwi]
build_flags =
    ${env.build_flags}
    -D ILI9341_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D USE_WOKWI_WIFI=1